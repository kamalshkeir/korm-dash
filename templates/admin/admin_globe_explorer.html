{{template "admin_base" .}}

{{define "admin_css"}}
<link rel="stylesheet" href="{{$.static_url}}/admin/css/pages/globe.css">
{{end}}

{{define "admin_title"}}3D Globe Explorer{{end}}

{{define "admin_main_content"}}
<div class="app-layout">
    <nav-bar id="mainNav"></nav-bar>
    <main class="main-content">
        <app-header titre="3D Globe Explorer" username="{{.User.Username}}" email="{{.User.Email}}"
            logout="{{$.admin_path}}/logout" restart="{{$.admin_path}}/restart"></app-header>

        <div class="admin-globe-full-page admin-globe-wrapper" id="admin-globe-wrapper">
            <!-- Floating Google Maps Style HUD -->
            <div class="admin-globe-hud">
                <!-- Google Maps Omnibox Search -->
                <div class="globe-search-omnibox-box">
                    <div class="search-omnibox">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input type="text" id="globe-search-input" class="search-omnibox-input"
                            placeholder="Search place, city, address, or lat, lng..." autocomplete="off"
                            spellcheck="false">
                        <button type="button" id="btn-search-clear" class="btn-search-clear" title="Clear search"
                            style="display:none;">&times;</button>
                        <div class="search-divider"></div>
                        <button type="button" id="btn-search-go" class="btn-search-go" title="Search / Fly">
                            <span>Go</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <!-- Live Search Suggestions Dropdown -->
                    <div id="globe-search-results" class="globe-search-results" style="display:none;"></div>
                </div>

                <!-- Custom Pins Layer -->
                <div class="hud-group layers-group">
                    <div class="hud-pill-group">
                        <button type="button" class="hud-pill active" id="toggle-layer-pins" data-layer="pins"
                            title="Custom Saved Pins">
                            <span>📍 Pins</span>
                            <b class="pill-count" id="count-pins">0</b>
                        </button>
                    </div>
                </div>

                <!-- Map Controls & Tools -->
                <div class="hud-group tools-group">
                    <div class="hud-pill-group">
                        <button type="button" class="hud-pill" id="btn-toggle-theme"
                            title="Toggle Light / Dark Map Mode">
                            <span id="theme-btn-label">☀️ Light</span>
                        </button>
                        <button type="button" class="hud-pill" id="btn-toggle-pinmode"
                            title="Toggle Add Marker mode (Click map to drop marker)">
                            <span>📍 Add Pin</span>
                        </button>
                        <button type="button" class="hud-pill" id="btn-toggle-satellite"
                            title="Toggle Satellite Imagery">
                            <span>🛰️ Sat</span>
                        </button>
                        <button type="button" class="hud-pill active" id="btn-toggle-tilt"
                            title="Toggle 3D Terrain & Pitch">
                            <span>🏔️ 3D</span>
                        </button>
                        <button type="button" class="hud-pill" id="btn-reset-view" title="Reset View">
                            <span>🌐 Reset</span>
                        </button>
                        <button type="button" class="hud-pill" id="btn-toggle-fullscreen"
                            title="Expand Fullscreen (True 100% Screen)">
                            <span>⛶ Max</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3D Map Container -->
            <div class="admin-map-container" id="admin-map-container">
                <div id="admin-globe-map" class="admin-globe-map"></div>

                <!-- Loader -->
                <div id="admin-map-loader" class="admin-map-loader">
                    <div class="loader-spinner"></div>
                    <p>Loading Universal 3D Globe & Coordinates Engine...</p>
                </div>

                <!-- Live Coordinate Bar (Cursor / Click) -->
                <div class="admin-coord-bar" id="admin-coord-bar">
                    <div class="coord-info">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                        <span id="coord-display-text">Click anywhere on the map to inspect coordinates</span>
                    </div>
                    <button type="button" class="btn-coord-copy" id="btn-copy-latlng"
                        title="Copy coordinates to clipboard" style="display:none;">
                        <span>Copy</span>
                    </button>
                </div>

                <!-- Inspector Drawer (shows when clicking a pin or searching) -->
                <div class="admin-inspector-drawer" id="admin-inspector-drawer">
                    <div class="drawer-header">
                        <div class="drawer-badge" id="drawer-badge">Entity</div>
                        <h3 id="drawer-title">Details</h3>
                        <button type="button" class="drawer-close" id="drawer-close">&times;</button>
                    </div>
                    <div class="drawer-body" id="drawer-body">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
{{end}}

{{define "admin_js"}}
<script type="module">
    import { GlobeExplorer } from '{{$.static_url}}/admin/js/GlobeExplorer.js';

    window.globeExplorer = new GlobeExplorer({
        container: '#admin-globe-map',
        wrapper: '#admin-globe-wrapper',
        center: [35.86, 33.87],
        zoom: 6.5,
        pitch: 50,
        theme: 'light',
        storageKey: 'globe-explorer-pins'
    });
</script>
{{end}}
